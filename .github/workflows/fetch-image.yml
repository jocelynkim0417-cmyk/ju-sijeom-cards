name: fetch-image
# 외부 이미지(AI 생성 결과, 무료 사진 등)를 받아 저장소 assets/ 에 저장합니다.
on:
  workflow_dispatch:
    inputs:
      url:
        description: 이미지 URL (여러 개면 공백으로 구분, path와 같은 순서)
        required: true
      path:
        description: 저장 경로 (예 assets/2026-10-26/expo-cover.png, 여러 개면 공백으로 구분)
        required: true
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download
        env:
          URLS: ${{ inputs.url }}
          DESTS: ${{ inputs.path }}
        run: |
          read -ra U <<< "$URLS"; read -ra D <<< "$DESTS"
          [ ${#U[@]} = ${#D[@]} ] || { echo "url/path count mismatch"; exit 1; }
          for i in "${!U[@]}"; do
            DEST="${D[$i]}"
            case "$DEST" in assets/*) ;; *) echo "path must start with assets/"; exit 1;; esac
            mkdir -p "$(dirname "$DEST")"
            curl -fsSL -A "Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 Mobile/15E148" -w "final=%{url_effective}\n" --max-filesize 20000000 -o "$DEST" "${U[$i]}" || { echo "FAILED ${U[$i]}"; rm -f "$DEST"; continue; }
            file "$DEST"
          done
      - name: Commit
        env:
          DESTS: ${{ inputs.path }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          read -ra D <<< "$DESTS"
          for f in "${D[@]}"; do [ -f "$f" ] && git add "$f"; done
          git commit -m "Add ${D[0]}$([ ${#D[@]} -gt 1 ] && echo " and $((${#D[@]}-1)) more")"
          for i in 1 2 3 4 5; do git pull --rebase -q origin "$GITHUB_REF_NAME" && git push && break; sleep $((i*3)); done
