name: gpt-image
# OpenAI(GPT) 이미지 생성 결과를 저장소 assets/ 에 저장합니다. 저장소 Secrets 에 OPENAI_API_KEY 가 필요합니다.
on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 이미지 프롬프트
        required: true
      path:
        description: 저장 경로 (예 assets/2026-10-27/park-cover.png)
        required: true
      size:
        description: 크기
        default: 1024x1536
      model:
        description: 모델
        default: gpt-image-1
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PROMPT: ${{ inputs.prompt }}
          DEST: ${{ inputs.path }}
          SIZE: ${{ inputs.size }}
          MODEL: ${{ inputs.model }}
        run: |
          case "$DEST" in assets/*) ;; *) echo "path must start with assets/"; exit 1;; esac
          [ -n "$OPENAI_API_KEY" ] || { echo "OPENAI_API_KEY secret is missing"; exit 1; }
          mkdir -p "$(dirname "$DEST")"
          jq -n --arg m "$MODEL" --arg p "$PROMPT" --arg s "$SIZE" '{model:$m,prompt:$p,size:$s,n:1}' > req.json
          curl -fsS https://api.openai.com/v1/images/generations \
            -H "Authorization: Bearer $OPENAI_API_KEY" -H "Content-Type: application/json" \
            -d @req.json -o res.json || { cat res.json 2>/dev/null; exit 1; }
          jq -r '.data[0].b64_json' res.json | base64 -d > "$DEST"
          rm -f req.json res.json
          file "$DEST"
      - name: Commit
        env:
          DEST: ${{ inputs.path }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          git commit -m "Add $DEST"
          for i in 1 2 3 4 5; do git pull --rebase -q origin "$GITHUB_REF_NAME" && git push && break; sleep $((i*3)); done
